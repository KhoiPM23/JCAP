<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/jcap-torii-blue.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JCAP - Luyện nói tiếng Nhật cùng AI</title>
    <!-- Nhúng Tailwind CSS trực tiếp để dùng ngay mọi class tiện ích -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--
      Class Tailwind trỏ vào token của design system (src/styles/tokens.css), đổi theo data-theme:
      bg-paper-100, text-sumi, border-line, bg-ai, bg-shu-soft, text-score-good, font-jp, font-mincho…
      Bo góc và đổ bóng đặt tên riêng (rounded-jc-lg, shadow-jc-md) để các trang cũ dùng rounded-lg/shadow-md
      của Tailwind giữ nguyên cho tới khi được làm lại theo thiết kế mới.
    -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: { 50: 'var(--paper-50)', 100: 'var(--paper-100)', 200: 'var(--paper-200)', 300: 'var(--paper-300)' },
              sumi: { DEFAULT: 'var(--sumi)', muted: 'var(--sumi-muted)', faint: 'var(--sumi-faint)' },
              line: { DEFAULT: 'var(--line)', strong: 'var(--line-strong)' },
              ai: { DEFAULT: 'var(--ai)', hover: 'var(--ai-hover)', soft: 'var(--ai-soft)' },
              'on-ai': 'var(--on-ai)',
              shu: { DEFAULT: 'var(--shu)', soft: 'var(--shu-soft)' },
              'on-shu': 'var(--on-shu)',
              sora: { DEFAULT: 'var(--sora)', soft: 'var(--sora-soft)' },
              'on-sora': 'var(--on-sora)',
              nami: { DEFAULT: 'var(--nami)', soft: 'var(--nami-soft)' },
              focus: 'var(--focus)',
              success: { DEFAULT: 'var(--success)', soft: 'var(--success-soft)' },
              warning: { DEFAULT: 'var(--warning)', soft: 'var(--warning-soft)' },
              danger: { DEFAULT: 'var(--danger)', soft: 'var(--danger-soft)' },
              info: { DEFAULT: 'var(--info)', soft: 'var(--info-soft)' },
              score: {
                good: 'var(--score-good)', 'good-soft': 'var(--score-good-soft)',
                mid: 'var(--score-mid)', 'mid-soft': 'var(--score-mid-soft)',
                low: 'var(--score-low)', 'low-soft': 'var(--score-low-soft)'
              },
              n5: { DEFAULT: 'var(--n5)', soft: 'var(--n5-soft)' },
              n4: { DEFAULT: 'var(--n4)', soft: 'var(--n4-soft)' },
              n3: { DEFAULT: 'var(--n3)', soft: 'var(--n3-soft)' },
              credit: { DEFAULT: 'var(--credit)', soft: 'var(--credit-soft)', coin: 'var(--credit-coin)' },
              quota: { '5h': 'var(--quota-5h)', week: 'var(--quota-week)' }
            },
            borderRadius: {
              'jc-sm': 'var(--radius-sm)', 'jc-md': 'var(--radius-md)', 'jc-lg': 'var(--radius-lg)', 'jc-xl': 'var(--radius-xl)', 'jc-full': 'var(--radius-full)'
            },
            boxShadow: { 'jc-sm': 'var(--shadow-sm)', 'jc-md': 'var(--shadow-md)', 'jc-lg': 'var(--shadow-lg)' },
            fontFamily: {
              sans: ['var(--font-sans)'],
              jp: ['var(--font-jp)'],
              mincho: ['var(--font-mincho)']
            }
          }
        }
      };
    </script>
    <!-- Fonts & Icons: Be Vietnam Pro (chữ Việt), Noto Sans JP (tiếng Nhật), Noto Serif JP (chữ trang trí) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
    <!-- Tạm giữ bộ Outlined cho các màn chưa làm lại (Shadowing, VoiceVoxTest); bỏ khi không còn chỗ nào dùng -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <style>
      body { font-family: var(--font-sans); }
      ruby { ruby-position: over; }
      ruby rt {
        font-size: 0.65em;
        font-weight: 500;
        line-height: 1;
        user-select: none;
      }
      .bubble-ai ruby rt { color: #0878EE; }
      .bubble-user ruby rt { color: #BAE6FD; }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
        50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      }
      .animate-pulse-glow {
        animation: pulseGlow 1.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
