<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/jcap-favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JCAP - Luyện nói tiếng Nhật cùng AI</title>
    <!-- Mô tả và thẻ chia sẻ cho landing page "/" (design-handoff mục 9d). Ảnh chia sẻ (og:image) chưa có, thêm khi có ảnh thật -->
    <meta name="description" content="Luyện nói tiếng Nhật từ N5 đến N3 cho người Việt: Shadowing có chấm độ khớp, hội thoại với nhân vật AI và hành trình trên bản đồ Nhật Bản." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="JCAP" />
    <meta property="og:title" content="JCAP · Đường ngàn dặm cũng bắt đầu từ một câu nói" />
    <meta property="og:description" content="Luyện nói tiếng Nhật từ N5 đến N3 cho người Việt. Bắt đầu miễn phí với Shadowing và Hành trình." />
    <!-- Tailwind được biên dịch lúc build (tailwind.config.js, src/styles/tailwind.css), không còn nạp qua CDN -->
    <!-- Fonts & Icons: Be Vietnam Pro (chữ Việt), Noto Sans JP (tiếng Nhật), Noto Serif JP (chữ trang trí) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
    <!-- Tạm giữ bộ Outlined cho các màn chưa làm lại (Shadowing, VoiceVoxTest); bỏ khi không còn chỗ nào dùng -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <style>
      body { font-family: var(--font-sans); }
      ruby { ruby-position: over; }
      ruby rt {
        font-size: 0.65em;
        font-weight: 500;
        line-height: 1;
        user-select: none;
      }
      .bubble-ai ruby rt { color: #0878EE; }
      .bubble-user ruby rt { color: #BAE6FD; }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
        50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      }
      .animate-pulse-glow {
        animation: pulseGlow 1.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
